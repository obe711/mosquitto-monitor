# Publishes broker log lines to $SYS/broker/log/# so mosquitto-monitor can show
# client connections and subscriptions. Install with:
#   sudo cp broker/monitor-log.conf /etc/mosquitto/conf.d/
#   sudo systemctl restart mosquitto
# Keeps any existing log_dest file line working; only one log_dest file is allowed
# per broker, so do not add another here.
log_dest topic
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
